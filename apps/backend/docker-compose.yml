# Local development database for TrackerPro backend.
# Usage:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: trackerpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackerpro
      POSTGRES_USER: trackerpro
      POSTGRES_PASSWORD: trackerpro_dev
    ports:
      - "5432:5432"
    volumes:
      - trackerpro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackerpro -d trackerpro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trackerpro_pgdata:
