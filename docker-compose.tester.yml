services:
  # ----------------------------------------------------
  # 1. DATABASE (PostgreSQL 16) - Self-seeding
  # ----------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: pms_postgres_tester
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clockit
      POSTGRES_DB: trackerpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_tester_data:/var/lib/postgresql/data
      - ./database/trackerpro-final.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - pms_tester_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackerpro"]
      interval: 3s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------
  # 2. PGADMIN 4 (Database Management Web UI)
  # ----------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pms_pgadmin_tester
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: clockit
    ports:
      - "5050:80"
    networks:
      - pms_tester_network
    depends_on:
      postgres_db:
        condition: service_healthy

  # ----------------------------------------------------
  # 3. BACKEND API (.NET Core)
  # ----------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: pms_backend_tester
    restart: unless-stopped
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=trackerpro;Username=postgres;Password=clockit
    ports:
      - "5194:8080"
    networks:
      - pms_tester_network

  # ----------------------------------------------------
  # 4. FRONTEND (React / Vite UI - Self-Contained)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: pms_frontend_tester
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - pms_tester_network

networks:
  pms_tester_network:
    driver: bridge

volumes:
  postgres_tester_data:
    driver: local
