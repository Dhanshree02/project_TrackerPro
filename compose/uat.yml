# UAT stack for functional testers. User switch stays on.
# Own database pms_uat. Does not use the production database.
#
#   docker compose -f compose/uat.yml -p pms-uat up -d --build
#
# App http://localhost:39117    API http://localhost:52819/swagger
# Postgres host port 41764

name: pms-uat

services:
  db:
    image: postgres:16-alpine
    container_name: pms_uat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clockit
      POSTGRES_DB: pms_uat
    ports:
      - "41764:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms_uat"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - pms_shared

  backend:
    image: pms-backend:uat
    pull_policy: build
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: pms-uat-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__Stage: uat
      Auth__AllowHeaderBypass: "true"
      ConnectionStrings__DefaultConnection: Host=pms_uat_db;Port=5432;Database=pms_uat;Username=postgres;Password=clockit;Maximum Pool Size=50;Connection Idle Lifetime=30
      Database__AutoMigrate: "false"
      Database__Seed: "false"
      Database__SyncSystemRoleBaselines: "false"
      Storage__RootPath: /app/storage
      Storage__DocumentsPath: /app/Documents
    ports:
      - "0.0.0.0:52819:8080"
    volumes:
      - backend_storage:/app/storage
      - ../Documents:/app/Documents
      - ../apps/backend/Log:/app/Log
    networks:
      - pms_shared

  frontend:
    image: pms-frontend:uat
    pull_policy: build
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: pms-uat-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://pms-uat-backend:8080
      VITE_API_URL: ""
      VITE_APP_ENV: uat
      VITE_HMR_CLIENT_PORT: "39117"
    ports:
      - "0.0.0.0:39117:3000"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    networks:
      - pms_shared

networks:
  pms_shared:
    external: true
    name: pms_shared

volumes:
  backend_storage:
    external: true
    name: pms-uat-storage
  postgres_data:
    name: pms_uat_postgres_data
