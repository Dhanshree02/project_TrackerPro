# Production stack. Same application as UAT. Login will replace user switch later.
# Until that login exists, this stack still runs the current application.
# Database pms_production on the shared Postgres container pms_uat_db.
#
#   docker compose -f compose/production.yml -p pms-production up -d
#
# App http://localhost:39127    API http://localhost:52827/swagger

name: pms-production

services:
  backend:
    image: pms-backend:uat-clean
    container_name: pms-production-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__Stage: production
      ConnectionStrings__DefaultConnection: Host=pms_uat_db;Port=5432;Database=pms_production;Username=postgres;Password=clockit;Maximum Pool Size=50;Connection Idle Lifetime=30
      Database__AutoMigrate: "false"
      Database__Seed: "false"
      Database__SyncSystemRoleBaselines: "false"
      Storage__RootPath: /app/storage
      Storage__DocumentsPath: /app/Documents
    ports:
      - "0.0.0.0:52827:8080"
    volumes:
      - backend_storage:/app/storage
      - ../Documents:/app/Documents
      - ../apps/backend/Log:/app/Log
    networks:
      - pms_shared

  frontend:
    image: pms-frontend:uat-clean
    container_name: pms-production-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://pms-production-backend:8080
      VITE_API_URL: ""
      VITE_APP_ENV: production
      VITE_HMR_CLIENT_PORT: "39127"
    ports:
      - "0.0.0.0:39127:3000"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    networks:
      - pms_shared

networks:
  pms_shared:
    external: true
    name: pms_shared

volumes:
  backend_storage:
    external: true
    name: pms-production-storage
