# Development stack. User switch stays on. Login is not used here.
# Database pms_development on the shared Postgres container pms_uat_db.
#
#   docker compose -f compose/development.yml -p pms-development up -d
#
# App http://localhost:39107    API http://localhost:52815/swagger

name: pms-development

services:
  backend:
    image: pms-backend:uat-clean
    container_name: pms-development-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__Stage: development
      ConnectionStrings__DefaultConnection: Host=pms_uat_db;Port=5432;Database=pms_development;Username=postgres;Password=clockit;Maximum Pool Size=50;Connection Idle Lifetime=30
      Database__AutoMigrate: "false"
      Database__Seed: "false"
      Database__SyncSystemRoleBaselines: "false"
      Storage__RootPath: /app/storage
      Storage__DocumentsPath: /app/Documents
    ports:
      - "0.0.0.0:52815:8080"
    volumes:
      - backend_storage:/app/storage
      - ../Documents:/app/Documents
      - ../apps/backend/Log:/app/Log
    networks:
      - pms_shared

  frontend:
    image: pms-frontend:uat-clean
    container_name: pms-development-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://pms-development-backend:8080
      VITE_API_URL: ""
      VITE_APP_ENV: development
      VITE_HMR_CLIENT_PORT: "39107"
    ports:
      - "0.0.0.0:39107:3000"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    networks:
      - pms_shared

networks:
  pms_shared:
    external: true
    name: pms_shared

volumes:
  backend_storage:
    external: true
    name: pms-development-storage
