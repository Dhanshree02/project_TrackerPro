# Development stack. User switch stays on. Login is not used here.
# Database pms_development on its own Postgres container pms_development_db.
# The shared container pms_uat_db stays up as the fallback and is not used by this app.
#
#   docker compose -f compose/development.yml -p pms-development up -d
#
# App http://localhost:39107    API http://localhost:52815/swagger
# Postgres host port 41761

name: pms-development

services:
  db:
    image: postgres:16-alpine
    container_name: pms_development_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: clockit
      POSTGRES_DB: pms_development
    ports:
      - "41761:5432"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=128MB
      -c idle_session_timeout=300000
      -c idle_in_transaction_session_timeout=60000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pms_development"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - pms_shared

  backend:
    image: pms-backend:uat-clean
    container_name: pms-development-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      App__Stage: development
      ConnectionStrings__DefaultConnection: Host=pms_development_db;Port=5432;Database=pms_development;Username=postgres;Password=clockit;Maximum Pool Size=50;Connection Idle Lifetime=30
      Database__AutoMigrate: "false"
      Database__Seed: "false"
      Database__SyncSystemRoleBaselines: "false"
      Storage__RootPath: /app/storage
      Storage__DocumentsPath: /app/Documents
    ports:
      - "0.0.0.0:52815:8080"
    volumes:
      - backend_storage:/app/storage
      - ../Documents:/app/Documents
      - ../apps/backend/Log:/app/Log
    networks:
      - pms_shared

  frontend:
    image: pms-frontend:uat-clean
    container_name: pms-development-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://pms-development-backend:8080
      VITE_API_URL: ""
      VITE_APP_ENV: development
      VITE_HMR_CLIENT_PORT: "39107"
    ports:
      - "0.0.0.0:39107:3000"
    volumes:
      - ../apps/frontend:/app
      - /app/node_modules
    networks:
      - pms_shared

networks:
  pms_shared:
    external: true
    name: pms_shared

volumes:
  backend_storage:
    external: true
    name: pms-development-storage
  postgres_data:
    name: pms_development_postgres_data
