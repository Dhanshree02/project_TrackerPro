# Automatic HTTPS reverse proxy for production (ports 80/443 -> pms-production-frontend:80).
# Keeps UAT untouched on :39117. Requires ports 80 and 443 open to the internet for Let's Encrypt.
#
#   docker compose -f compose/caddy.yml -p pms-proxy up -d
#
# Production URL: https://pms-uat.talakunchi.com

name: pms-proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: pms-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - pms_shared

networks:
  pms_shared:
    external: true
    name: pms_shared

volumes:
  caddy_data:
    name: pms_caddy_data
  caddy_config:
    name: pms_caddy_config
